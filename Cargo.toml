[workspace]
members = ["crates/openstruct", "apps/openstruct-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenStruct Contributors"]
rust-version = "1.85"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
rfd = "0.17"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
