name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libfontconfig1-dev xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi
        shell: bash

      - name: Build release binaries
        run: cargo build --release --locked -p openstruct -p openstruct-gui

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/openstruct-gui.exe dist/OpenStruct.exe
            cp target/release/openstruct.exe dist/openstruct-cli.exe
            cp target/release/openstruct.dll dist/openstruct.dll
            cp README.md LICENSE CHANGELOG.md dist/
            (cd dist && 7z a ../OpenStruct-Windows.zip .)
          else
            cp target/release/openstruct-gui dist/OpenStruct
            cp target/release/openstruct dist/openstruct-cli
            cp target/release/libopenstruct.so dist/libopenstruct.so
            cp README.md LICENSE CHANGELOG.md dist/
            (cd dist && tar -czf ../OpenStruct-Linux.tar.gz .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenStruct-${{ runner.os }}
          path: |
            OpenStruct-Windows.zip
            OpenStruct-Linux.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n'

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenStruct-Windows.zip
            artifacts/OpenStruct-Linux.tar.gz
          generate_release_notes: true
