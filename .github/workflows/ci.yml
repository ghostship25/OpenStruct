name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libfontconfig1-dev xvfb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --locked

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked

  build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p openstruct -p openstruct-gui

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/openstruct-gui.exe dist/OpenStruct.exe
            cp target/release/openstruct.exe dist/openstruct-cli.exe
            cp target/release/openstruct.dll dist/openstruct.dll
            (cd dist && 7z a ../OpenStruct-Windows.zip .)
          else
            cp target/release/openstruct-gui dist/OpenStruct
            cp target/release/openstruct dist/openstruct-cli
            cp target/release/libopenstruct.so dist/libopenstruct.so
            (cd dist && tar -czf ../OpenStruct-Linux.tar.gz .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OpenStruct-${{ runner.os }}
          path: |
            OpenStruct-Windows.zip
            OpenStruct-Linux.tar.gz
          if-no-files-found: error
